services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    command: sh -c "composer install --no-interaction && php artisan migrate --force && cd public && php -S 0.0.0.0:8000 ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php"
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
      - app-bootstrap-cache:/var/www/html/bootstrap/cache
      - app-vendor:/var/www/html/vendor
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit((int) (! @file_get_contents('http://127.0.0.1:8000/up')));\""]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: isp_manager
      DB_USERNAME: isp_manager
      DB_PASSWORD: isp_manager
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-null}
      STRIPE_SECRET: ${STRIPE_SECRET:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_ENDPOINT: ${STRIPE_ENDPOINT:-https://api.stripe.com}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_WEBHOOK_TOLERANCE: ${STRIPE_WEBHOOK_TOLERANCE:-300}
      STRIPE_TIMEOUT: ${STRIPE_TIMEOUT:-15}
      WHISH_ENABLED: ${WHISH_ENABLED:-false}
      WHISH_ENVIRONMENT: ${WHISH_ENVIRONMENT:-sandbox}
      WHISH_CHANNEL: ${WHISH_CHANNEL:-}
      WHISH_SECRET: ${WHISH_SECRET:-}
      WHISH_WEBSITE_URL: ${WHISH_WEBSITE_URL:-http://localhost:8000}
      WHISH_ENDPOINT: ${WHISH_ENDPOINT:-}
      WHISH_TIMEOUT: ${WHISH_TIMEOUT:-15}
      WHISH_SUCCESS_CALLBACK_URL: ${WHISH_SUCCESS_CALLBACK_URL:-}
      WHISH_FAILURE_CALLBACK_URL: ${WHISH_FAILURE_CALLBACK_URL:-}
      WHISH_SUCCESS_REDIRECT_URL: ${WHISH_SUCCESS_REDIRECT_URL:-}
      WHISH_FAILURE_REDIRECT_URL: ${WHISH_FAILURE_REDIRECT_URL:-}
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    command: sh -c "php artisan queue:work --sleep=1 --tries=3 --timeout=90"
    volumes:
      - .:/var/www/html
      - app-bootstrap-cache:/var/www/html/bootstrap/cache
      - app-vendor:/var/www/html/vendor
    environment:
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: isp_manager
      DB_USERNAME: isp_manager
      DB_PASSWORD: isp_manager
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    command: sh -c "php artisan schedule:work"
    volumes:
      - .:/var/www/html
      - app-bootstrap-cache:/var/www/html/bootstrap/cache
      - app-vendor:/var/www/html/vendor
    environment:
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: isp_manager
      DB_USERNAME: isp_manager
      DB_PASSWORD: isp_manager
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
    depends_on:
      app:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /var/www/html
    command: sh -c "npm ci && npm run build && tail -f /dev/null"
    volumes:
      - .:/var/www/html
      - frontend-node-modules:/var/www/html/node_modules
    depends_on:
      app:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: isp_manager
      POSTGRES_USER: isp_manager
      POSTGRES_PASSWORD: isp_manager
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isp_manager -d isp_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  app-bootstrap-cache:
  app-vendor:
  frontend-node-modules:
  postgres-data:
  redis-data:
  minio-data:
