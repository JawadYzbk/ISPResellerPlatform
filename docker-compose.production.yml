x-app-service: &app-service
  build:
    context: .
    dockerfile: docker/php/Dockerfile.production
  image: ${APP_IMAGE:-isp-manager-app}:${APP_VERSION:-local}
  working_dir: /var/www/html
  init: true
  restart: unless-stopped
  environment: *app-environment
  volumes:
    - app-bootstrap-cache:/var/www/html/bootstrap/cache

services:
  app:
    <<: *app-service
    command: ["php-fpm", "-F"]
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: ${WEB_IMAGE:-isp-manager-web}:${APP_VERSION:-local}
    init: true
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8000}:80"
    depends_on:
      app:
        condition: service_healthy
      reverb:
        condition: service_started

  worker:
    <<: *app-service
    command:
      - php
      - artisan
      - queue:work
      - --sleep=1
      - --tries=3
      - --timeout=90
      - --queue=critical,billing,provisioning,notifications,imports,reports,default
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    <<: *app-service
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  reverb:
    <<: *app-service
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    expose:
      - "8080"
    depends_on:
      redis:
        condition: service_healthy

  whatsapp-web:
    build:
      context: ./integrations/whatsapp-web
      dockerfile: Dockerfile
    image: ${WHATSAPP_WEB_IMAGE:-isp-manager-whatsapp-web}:${APP_VERSION:-local}
    profiles: ["whatsapp"]
    init: true
    restart: unless-stopped
    environment:
      WHATSAPP_WEB_HOST: 0.0.0.0
      WHATSAPP_WEB_PORT: 3001
      WHATSAPP_WEB_TOKEN: ${WHATSAPP_WEB_TOKEN:-}
      WHATSAPP_WEBHOOK_URL: ${WHATSAPP_WEBHOOK_URL:-http://web/api/v1/webhooks/gateways/whatsapp_web}
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET:-}
      WHATSAPP_WEB_CLIENT_ID: ${WHATSAPP_WEB_CLIENT_ID:-isp-manager}
      WHATSAPP_WEB_HEADLESS: "true"
      WHATSAPP_WEB_MEMORY_WARNING_MB: ${WHATSAPP_WEB_MEMORY_WARNING_MB:-2048}
      PUPPETEER_EXECUTABLE_PATH: ${PUPPETEER_EXECUTABLE_PATH:-/usr/bin/chromium}
      WHATSAPP_WEB_SESSION_PATH: /data/.wwebjs_auth
    volumes:
      - whatsapp-web-auth:/data
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      web:
        condition: service_started

  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-isp_manager}
      POSTGRES_USER: ${DB_USERNAME:-isp_manager}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-isp_manager} -d ${DB_DATABASE:-isp_manager}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-change-me}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD:-change-me}' ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minio}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-change-me}
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minio}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-change-me}
      AWS_BUCKET: ${AWS_BUCKET:-isp-media}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          sleep 2
        done
        mc mb --ignore-existing "local/$$AWS_BUCKET"
    depends_on:
      minio:
        condition: service_started

volumes:
  app-bootstrap-cache:
  postgres-data:
  redis-data:
  minio-data:
  whatsapp-web-auth:
