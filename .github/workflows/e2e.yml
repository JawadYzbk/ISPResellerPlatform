name: Browser acceptance

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

jobs:
  chromium:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_DEBUG: false
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: sqlite
      DB_DATABASE: ${{ github.workspace }}/database/e2e.sqlite
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: local
      SECURITY_ENFORCE_TWO_FACTOR: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, zip
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Prepare seeded test application
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan migrate:fresh --seed --force
          npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser acceptance journeys
        run: npm run e2e

      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
