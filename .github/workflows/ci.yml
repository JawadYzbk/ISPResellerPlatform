name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, pdo_pgsql, zip
          coverage: pcov

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Composer dependency audit
        run: composer audit --no-interaction

      - name: JavaScript dependency audit
        run: npm audit --audit-level=high

      - name: PHP formatting
        run: vendor/bin/pint --test

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress

      - name: Feature and unit tests
        run: php artisan test --coverage --coverage-clover storage/coverage.xml

      - name: Prepare API contract artifact
        if: always()
        run: |
          mkdir -p build/api
          cp openapi/isp-platform-v1.yaml build/api/isp-platform-v1.yaml

      - name: Upload API contract and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-contract-and-coverage
          path: |
            build/api/isp-platform-v1.yaml
            storage/coverage.xml
          if-no-files-found: warn

      - name: Typecheck
        run: npm run typecheck

      - name: JavaScript lint
        run: npm run lint

      - name: Frontend build
        run: npm run build
