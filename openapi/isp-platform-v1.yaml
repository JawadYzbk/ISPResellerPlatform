openapi: 3.1.0
info:
  title: ISP Manager API
  version: 1.0.0
  description: Versioned mobile and portal contract. The first implementation slice is web-only; routes are added as vertical tickets land.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      summary: Readiness check
      responses:
        '200':
          description: Application is ready
  /customers:
    get:
      summary: List tenant customers
      parameters:
        - in: query
          name: filter[search]
          schema: { type: string }
        - in: query
          name: filter[status]
          schema: { type: string, enum: [active, inactive, archived] }
      responses:
        '200': { description: Paginated customer list }
        '401': { description: Unauthenticated }
        '403': { description: Forbidden }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
