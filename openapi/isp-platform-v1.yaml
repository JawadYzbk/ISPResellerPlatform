          schema: { type: string, maxLength: 120 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: integer, minimum: 1 }
      responses:
        '201': { description: Wallet transaction created }
        '401': { description: Recent authentication is required for wallet funding }
        '403': { description: Missing wallet funding capability }
