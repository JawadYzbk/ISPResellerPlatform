openapi: 3.1.0
info:
  title: ISP Manager API
  version: 1.0.0
description: Versioned mobile and portal contract for tenant-scoped reads, scoped Sanctum abilities, idempotent collection writes, offline collector sync, imports, technician operations and customer self-service.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      summary: Readiness check
      responses:
        '200':
          description: Application and dependencies are ready
        '503':
          description: One or more dependencies are degraded
  /tokens:
    post:
      security: []
      summary: Issue a scoped Sanctum API token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, device_name]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                device_name: { type: string, maxLength: 100 }
                abilities:
                  type: array
                  items: { type: string, enum: [customer, staff:collector, staff:technician, staff:operator] }
                  description: Optional narrowing of the role-derived ability.
                otp: { type: string, minLength: 6, maxLength: 16 }
      responses:
        '200': { description: Bearer token and granted abilities }
        '401': { description: Invalid credentials }
        '403': { description: Requested ability is outside the user's role }
        '423': { description: Two-factor verification required }
  /tokens/current:
    delete:
      summary: Revoke the current API token
      responses:
        '204': { description: Token revoked }
        '401': { description: Unauthenticated }
  /auth/staff/login:
    post:
      security: []
      summary: Authenticate a staff device and issue a scoped Sanctum token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, device_name, device_id]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                device_name: { type: string, maxLength: 100 }
                device_id: { type: string, maxLength: 100 }
                abilities:
                  type: array
                  items: { type: string, enum: [staff:collector, staff:technician, staff:operator] }
      responses:
        '200': { description: Bearer token, user identity and granted abilities }
        '401': { description: Invalid staff credentials }
        '422': { description: Two-factor challenge required; response includes challenge_id }
        '423': { description: Staff two-factor setup is required }
  /auth/staff/two-factor:
    post:
      security: []
      summary: Complete a staff two-factor authentication challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_id, code]
              properties:
                challenge_id: { type: string, maxLength: 26 }
                code: { type: string, minLength: 6, maxLength: 16 }
      responses:
        '200': { description: Bearer token, user identity and granted abilities }
        '422': { description: Invalid or expired challenge/code }
  /app/config:
    get:
      summary: Read mobile version and maintenance configuration
      responses:
        '200':
          description: Client launch configuration
          content:
            application/json:
              schema:
                type: object
                required: [min_supported_version, latest_version, maintenance, force_update]
                properties:
                  min_supported_version: { type: string }
                  latest_version: { type: string }
                  maintenance: { type: boolean }
                  message: { type: string, nullable: true }
                  force_update: { type: boolean }
  /me:
    get:
      summary: Read the authenticated staff identity
      responses:
        '200': { description: Current user and role data }
        '401': { description: Unauthenticated }
  /auth/me:
    get:
      summary: Read the authenticated staff identity and token abilities
      responses:
        '200': { description: Current user and token ability data }
        '401': { description: Unauthenticated }
  /auth/logout:
    post:
      summary: Revoke the current bearer token
      responses:
        '204': { description: Token revoked }
        '401': { description: Unauthenticated }
  /auth/devices/{device}/revoke:
    post:
      summary: Revoke all bearer tokens registered to a device
      parameters:
        - in: path
          name: device
          required: true
          schema: { type: string, maxLength: 100 }
      responses:
        '204': { description: Device tokens revoked }
        '401': { description: Unauthenticated }
  /auth/push-token:
    post:
      summary: Register or refresh an encrypted push notification token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, platform, app]
              properties:
                token: { type: string, maxLength: 4096 }
                platform: { type: string, enum: [android, ios, web] }
                app: { type: string, maxLength: 100 }
      responses:
        '204': { description: Push token registered }
        '401': { description: Unauthenticated }
  /customers:
    get:
      summary: List tenant customers
      parameters:
        - in: query
          name: filter[search]
          schema: { type: string }
        - in: query
          name: filter[status]
          schema: { type: string, enum: [active, inactive, archived] }
        - in: query
          name: sort
          schema: { type: string, enum: [created_at, -created_at, code, -code], default: -created_at }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        '200': { description: Paginated customer list }
        '401': { description: Unauthenticated }
        '403': { description: Forbidden }
  /customers/{customer}:
    get:
      summary: Read one tenant customer
      parameters:
        - in: path
          name: customer
          required: true
          schema: { type: string, description: Customer public ULID }
      responses:
        '200': { description: Customer resource }
        '401': { description: Unauthenticated }
        '404': { description: Customer not found }
  /services:
    get:
      summary: List tenant services
      parameters:
        - in: query
          name: filter[status]
          schema: { type: string, enum: [pending, active, suspended, paused, terminated] }
        - in: query
          name: filter[search]
          schema: { type: string }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        '200': { description: Cursor-paginated service list }
        '401': { description: Unauthenticated }
        '403': { description: Missing staff ability }
  /services/{service}:
    get:
      summary: Read one tenant service with plan, customer and network history
      parameters:
        - in: path
          name: service
          required: true
          schema: { type: string }
      responses:
        '200': { description: Service resource }
        '403': { description: Missing service view capability }
        '404': { description: Service not found }
  /services/{service}/network-commands:
    get:
      summary: List recent network commands for a service
      parameters:
        - in: path
          name: service
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200': { description: Sanitized recent command history }
        '403': { description: Missing service view capability }
        '404': { description: Service not found }
  /network-commands/{command}:
    get:
      summary: Poll a network command
      parameters:
        - in: path
          name: command
          required: true
          schema: { type: string }
      responses:
        '200': { description: Sanitized command status and result }
        '403': { description: Missing network view capability }
        '404': { description: Network command not found }
  /services/{service}/activate:
    post:
      summary: Activate a service and enqueue network provisioning
      parameters:
        - in: path
          name: service
          required: true
          schema: { type: string }
        - in: header
          name: X-Idempotency-Key
          required: true
          schema: { type: string, maxLength: 120 }
      responses:
        '202': { description: Commercial state changed and network command queued }
        '403': { description: Missing activation capability }
  /services/{service}/suspend:
    post:
      summary: Suspend a service and enqueue network enforcement
      parameters:
        - in: path
          name: service
          required: true
          schema: { type: string }
        - in: header
          name: X-Idempotency-Key
          required: true
          schema: { type: string, maxLength: 120 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 64 }
                note: { type: string, maxLength: 5000 }
      responses:
        '202': { description: Commercial state changed and network command queued }
        '403': { description: Missing suspension capability }
  /services/{service}/resume:
    post:
      summary: Resume a suspended service and enqueue network enforcement
      parameters:
        - in: path
          name: service
          required: true
          schema: { type: string }
        - in: header
          name: X-Idempotency-Key
          required: true
          schema: { type: string, maxLength: 120 }
      responses:
        '202': { description: Commercial state changed and network command queued }
        '403': { description: Missing activation or force-resume capability }
  /services/{service}/pause:
    post:
      summary: Pause an active service while preserving its billing expiry
      parameters:
        - in: path
          name: service
          required: true
          schema: { type: string }
        - in: header
          name: X-Idempotency-Key
          required: true
          schema: { type: string, maxLength: 120 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 64 }
                resume_at: { type: string, format: date-time, nullable: true }
      responses:
        '202': { description: Service paused and network enforcement queued }
        '403': { description: Missing pause capability }
        '422': { description: Only active services can be paused }
  /services/{service}/terminate:
    post:
      summary: Terminate a service and enqueue network disconnect
      parameters:
        - in: path
          name: service
          required: true
          schema: { type: string }
        - in: header
          name: X-Idempotency-Key
          required: true
          schema: { type: string, maxLength: 120 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 5000 }
      responses:
        '202': { description: Service terminated, assigned equipment returned to recovery custody, and network disconnect queued }
        '403': { description: Missing termination capability }
  /services/{service}/disconnect-session:
    post:
      summary: Disconnect the current live session for a service
      parameters:
        - in: path
          name: service
          required: true
          schema: { type: string }
        - in: header
          name: X-Idempotency-Key
          required: true
          schema: { type: string, maxLength: 120 }
      responses:
        '202': { description: Network disconnect queued with the latest live session identifier when available }
        '403': { description: Missing network disconnect capability }
  /services/{service}/resync:
    post:
      summary: Re-push the service's desired state to its network driver
      parameters:
        - in: path
          name: service
          required: true
          schema: { type: string }
        - in: header
          name: X-Idempotency-Key
          required: true
          schema: { type: string, maxLength: 120 }
      responses:
        '202': { description: Desired service state queued for network synchronization }
        '403': { description: Missing service state capability }
        '422': { description: Terminated services cannot be re-synced }
  /services/{service}/plan-change-previews:
    post:
      summary: Preview an immediate or next-cycle service plan change
      parameters:
        - in: path
          name: service
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanChangeRequest'
      responses:
        '200': { description: Proration amounts and effective date preview }
        '403': { description: Missing service plan-change capability }
        '422': { description: Plan change cannot be applied }
  /services/{service}/change-plan:
    post:
      summary: Change a service plan and queue network synchronization
      parameters:
        - in: path
          name: service
          required: true
          schema: { type: string }
        - in: header
          name: X-Idempotency-Key
          required: true
          schema: { type: string, maxLength: 120 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanChangeRequest'
      responses:
        '202': { description: Plan changed or scheduled and network synchronization queued when applicable }
        '403': { description: Missing service plan-change capability }
        '409': { description: Idempotency key reused for a different request }
        '422': { description: Plan change cannot be applied }
  /services/{service}/renewal-previews:
    post:
      summary: Preview a service renewal before issuing its invoice
      parameters:
        - in: path
          name: service
          required: true
          schema: { type: string, description: Service public ULID }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                periods: { type: integer, minimum: 1, maximum: 12, default: 1 }
      responses:
        '200': { description: Signed short-lived preview with amount and new expiry }
        '403': { description: Missing service view capability }
        '422': { description: Renewal cannot be previewed }
  /services/{service}/renewals:
    post:
      summary: Issue an invoice for a previously previewed service renewal
      parameters:
        - in: path
          name: service
          required: true
          schema: { type: string, description: Service public ULID }
        - in: header
          name: X-Idempotency-Key
          required: true
          schema: { type: string, maxLength: 120 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenewalRequest'
      responses:
        '202': { description: Renewal invoice issued; service is extended after full payment }
        '403': { description: Missing service view capability }
        '409': { description: Idempotency key reused for a different request }
        '422': { description: Preview is invalid or expired }
  /payments:
    post:
      summary: Record a customer payment
      parameters:
        - in: header
          name: X-Idempotency-Key
          required: true
          schema: { type: string, maxLength: 120 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '201': { description: Payment recorded }
        '400': { description: Missing or invalid idempotency key }
        '409': { description: Idempotency key reused for a different request }
        '422': { description: Validation failed }
  /portal/{tenant}/otp/request:
    post:
      security: []
      summary: Request a customer portal OTP
      description: Always returns the same response shape for known and unknown phone numbers.
      parameters:
        - in: path
          name: tenant
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string }
      responses:
        '200': { description: OTP challenge created }
        '429': { description: Rate limited }
  /portal/{tenant}/otp/verify:
    post:
      security: []
      summary: Verify a customer portal OTP
      parameters:
        - in: path
          name: tenant
          required: true
          schema: { type: string }
      responses:
        '200': { description: Portal bearer session issued }
        '422': { description: Invalid or expired code }
  /portal/{tenant}/me:
    get:
      summary: Read the authenticated customer portal profile
      parameters:
        - in: path
          name: tenant
          required: true
          schema: { type: string }
      responses:
        '200': { description: Customer profile and services }
        '401': { description: Invalid portal session }
  /portal/{tenant}/me/profile:
    get:
      summary: Read the authenticated customer portal profile
      parameters:
        - in: path
          name: tenant
          required: true
          schema: { type: string }
      responses:
        '200': { description: Customer profile and services }
        '401': { description: Invalid portal session }
    patch:
      summary: Update customer contact and notification preferences
      parameters:
        - in: path
          name: tenant
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email, nullable: true }
                address: { type: string, maxLength: 500, nullable: true }
                notification_preferences: { type: object, additionalProperties: true }
      responses:
        '200': { description: Updated customer profile fields }
        '401': { description: Invalid portal session }
        '422': { description: Validation failed }
  /portal/{tenant}/me/balance:
    get:
      summary: Read the authenticated customer's balance and next due invoice
      parameters:
        - in: path
          name: tenant
          required: true
          schema: { type: string }
      responses:
        '200': { description: Customer balance and next outstanding invoice }
        '401': { description: Invalid portal session }
  /portal/{tenant}/me/invoices:
    get:
      summary: List the authenticated customer's invoices
      parameters:
        - in: path
          name: tenant
          required: true
          schema: { type: string }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        '200': { description: Cursor-paginated invoice summaries with line items }
        '401': { description: Invalid portal session }
  /portal/{tenant}/me/invoices/{invoice}:
    get:
      summary: Read one authenticated customer invoice
      parameters:
        - in: path
          name: tenant
          required: true
          schema: { type: string }
        - in: path
          name: invoice
          required: true
          schema: { type: string, description: Invoice public ULID }
      responses:
        '200': { description: Invoice detail with lines and allocated payments }
        '401': { description: Invalid portal session }
        '404': { description: Invoice not found for this customer }
  /portal/{tenant}/me/invoices/{invoice}/pdf:
    get:
      summary: Download one authenticated customer invoice as PDF
      parameters:
        - in: path
          name: tenant
          required: true
          schema: { type: string }
        - in: path
          name: invoice
          required: true
          schema: { type: string, description: Invoice public ULID }
      responses:
        '200':
          description: A4 invoice PDF
          content:
            application/pdf: { schema: { type: string, format: binary } }
        '401': { description: Invalid portal session }
        '404': { description: Invoice not found for this customer }
  /portal/{tenant}/me/payments:
    get:
      summary: List the authenticated customer's posted payments
      parameters:
        - in: path
          name: tenant
          required: true
          schema: { type: string }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        '200': { description: Cursor-paginated payment receipt summaries }
        '401': { description: Invalid portal session }
  /portal/{tenant}/me/services:
    get:
      summary: List the authenticated customer's services and current sessions
      parameters:
        - in: path
          name: tenant
          required: true
          schema: { type: string }
      responses:
        '200': { description: Customer service summaries }
        '401': { description: Invalid portal session }
  /portal/{tenant}/me/payments/intent:
    post:
      summary: Create a customer payment intent through the configured gateway
      parameters:
        - in: path
          name: tenant
          required: true
          schema: { type: string }
        - in: header
          name: X-Idempotency-Key
          required: true
          schema: { type: string, maxLength: 120 }
      responses:
        '201': { description: Gateway-specific payment intent payload }
        '401': { description: Invalid portal session }
        '404': { description: Invoice not found for this customer }
        '503': { description: No payment gateway is configured }
  /portal/{tenant}/me/services/{service}/usage:
    get:
      summary: Read daily usage for an owned service
      parameters:
        - in: path
          name: tenant
          required: true
          schema: { type: string }
        - in: path
          name: service
          required: true
          schema: { type: string, description: Service public ULID }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        '200': { description: Daily input, output and total octets }
        '401': { description: Invalid portal session }
        '404': { description: Service is not owned by the portal customer }
  /portal/{tenant}/me/services/{service}/restart-session:
    post:
      summary: Queue a customer-owned PPP session restart
      parameters:
        - in: path
          name: tenant
          required: true
          schema: { type: string }
        - in: path
          name: service
          required: true
          schema: { type: string, description: Service public ULID }
        - in: header
          name: X-Idempotency-Key
          required: true
          schema: { type: string, maxLength: 120 }
      responses:
        '202': { description: Network disconnect queued for the customer-owned service }
        '401': { description: Invalid portal session }
        '404': { description: Service is not owned by the portal customer }
        '429': { description: Restart limited to once every five minutes }
  /portal/{tenant}/me/notices:
    get:
      summary: Read active incidents affecting the customer's zone or POP
      parameters:
        - in: path
          name: tenant
          required: true
          schema: { type: string }
      responses:
        '200': { description: Active customer-scoped outage notices }
        '401': { description: Invalid portal session }
  /portal/{tenant}/me/tickets:
    get:
      summary: List the authenticated customer's support tickets
      parameters:
        - in: path
          name: tenant
          required: true
          schema: { type: string }
      responses:
        '200': { description: Customer-owned ticket summaries }
        '401': { description: Invalid portal session }
    post:
      summary: Open a support ticket for the authenticated customer
      parameters:
        - in: path
          name: tenant
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, subject, description]
              properties:
                category: { type: string, enum: [no_service, slow, billing, relocation, other] }
                subject: { type: string, maxLength: 160 }
                description: { type: string, maxLength: 5000 }
                service_uuid: { type: string, nullable: true }
      responses:
        '201': { description: Ticket created }
        '401': { description: Invalid portal session }
        '422': { description: Validation failed }
  /portal/{tenant}/me/tickets/{ticket}:
    get:
      summary: Read a customer-owned ticket and public messages
      parameters:
        - in: path
          name: tenant
          required: true
          schema: { type: string }
        - in: path
          name: ticket
          required: true
          schema: { type: string, description: Ticket public ULID }
      responses:
        '200': { description: Ticket detail and public message history }
        '401': { description: Invalid portal session }
        '404': { description: Ticket not found }
  /portal/{tenant}/me/tickets/{ticket}/messages:
    post:
      summary: Add a public reply to a customer-owned ticket
      parameters:
        - in: path
          name: tenant
          required: true
          schema: { type: string }
        - in: path
          name: ticket
          required: true
          schema: { type: string, description: Ticket public ULID }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, maxLength: 5000 }
      responses:
        '200': { description: Ticket with the appended public message }
        '401': { description: Invalid portal session }
        '404': { description: Ticket not found }
  /portal/{tenant}/billing:
    get:
      summary: Read the authenticated customer's invoice and payment history
      parameters:
        - in: path
          name: tenant
          required: true
          schema: { type: string }
      responses:
        '200': { description: Recent invoices, lines and payments }
        '401': { description: Invalid portal session }
  /portal/{tenant}/payments/intent:
    post:
      summary: Create a customer payment intent through the configured gateway
      parameters:
        - in: path
          name: tenant
          required: true
          schema: { type: string }
        - in: header
          name: X-Idempotency-Key
          required: true
          schema: { type: string, maxLength: 120 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invoice_id, amount]
              properties:
                invoice_id: { type: string, description: Invoice public ULID }
                amount: { type: integer, minimum: 1, description: Amount in minor currency units }
      responses:
        '200': { description: Gateway-specific payment intent payload }
        '401': { description: Invalid portal session }
        '404': { description: Invoice not found for this customer }
        '503': { description: No payment gateway is configured }
  /collector/payments/batch:
    post:
      summary: Record collector payments in a partial-success batch
      parameters:
        - in: header
          name: X-Idempotency-Key
          required: true
          schema: { type: string, maxLength: 120 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  maxItems: 100
                  items: { $ref: '#/components/schemas/PaymentRequest' }
      responses:
        '200': { description: Per-item success/error results }
        '409': { description: Idempotency key reused for a different request }
  /collector/shift:
