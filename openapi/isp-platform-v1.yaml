      description: Provide either csv text or a file upload.
    ImportResponse:
      type: object
      required: [id, type, status, total_rows, successful_rows, failed_rows, report]
      properties:
        id: { type: string }
        type: { type: string }
        filename: { type: string }
        status: { type: string, enum: [preview, completed, rolled_back] }
        total_rows: { type: integer }
        successful_rows: { type: integer }
        failed_rows: { type: integer }
        report: { type: array, items: { type: object } }
