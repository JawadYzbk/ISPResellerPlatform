openapi: 3.1.0
info:
  title: ISP Manager API
  version: 1.0.0
description: Versioned mobile and portal contract for tenant-scoped reads, scoped Sanctum abilities, idempotent collection writes, offline collector sync, imports, technician operations and customer self-service.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      summary: Readiness check
      responses:
        '200':
          description: Application and dependencies are ready
        '503':
          description: One or more dependencies are degraded
  /tokens:
    post:
      security: []
      summary: Issue a scoped Sanctum API token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, device_name]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                device_name: { type: string, maxLength: 100 }
                abilities:
                  type: array
                  items: { type: string, enum: [customer, staff:collector, staff:technician, staff:operator] }
                  description: Optional narrowing of the role-derived ability.
                otp: { type: string, minLength: 6, maxLength: 16 }
      responses:
        '200': { description: Bearer token and granted abilities }
        '401': { description: Invalid credentials }
        '403': { description: Requested ability is outside the user's role }
        '423': { description: Two-factor verification required }
  /tokens/current:
    delete:
      summary: Revoke the current API token
      responses:
        '204': { description: Token revoked }
        '401': { description: Unauthenticated }
  /app/config:
    get:
      summary: Read mobile version and maintenance configuration
      responses:
        '200':
          description: Client launch configuration
          content:
            application/json:
              schema:
                type: object
                required: [min_supported_version, latest_version, maintenance, force_update]
                properties:
                  min_supported_version: { type: string }
                  latest_version: { type: string }
                  maintenance: { type: boolean }
                  message: { type: string, nullable: true }
                  force_update: { type: boolean }
  /me:
    get:
      summary: Read the authenticated staff identity
      responses:
        '200': { description: Current user and role data }
        '401': { description: Unauthenticated }
  /customers:
    get:
      summary: List tenant customers
      parameters:
        - in: query
          name: filter[search]
          schema: { type: string }
        - in: query
          name: filter[status]
          schema: { type: string, enum: [active, inactive, archived] }
        - in: query
          name: sort
          schema: { type: string, enum: [created_at, -created_at, code, -code], default: -created_at }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        '200': { description: Paginated customer list }
        '401': { description: Unauthenticated }
        '403': { description: Forbidden }
  /customers/{customer}:
    get:
      summary: Read one tenant customer
      parameters:
        - in: path
          name: customer
          required: true
          schema: { type: string, description: Customer public ULID }
      responses:
        '200': { description: Customer resource }
        '401': { description: Unauthenticated }
        '404': { description: Customer not found }
  /services:
    get:
      summary: List tenant services
      parameters:
        - in: query
          name: filter[status]
          schema: { type: string, enum: [pending, active, suspended, terminated] }
        - in: query
          name: filter[search]
          schema: { type: string }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        '200': { description: Cursor-paginated service list }
        '401': { description: Unauthenticated }
        '403': { description: Missing staff ability }
  /services/{service}:
    get:
      summary: Read one tenant service with plan, customer and network history
      parameters:
        - in: path
          name: service
          required: true
          schema: { type: string }
      responses:
        '200': { description: Service resource }
        '403': { description: Missing service view capability }
        '404': { description: Service not found }
  /services/{service}/activate:
    post:
      summary: Activate a service and enqueue network provisioning
      parameters:
        - in: path
          name: service
          required: true
          schema: { type: string }
        - in: header
          name: X-Idempotency-Key
          required: true
          schema: { type: string, maxLength: 120 }
      responses:
        '202': { description: Commercial state changed and network command queued }
        '403': { description: Missing activation capability }
  /services/{service}/suspend:
    post:
      summary: Suspend a service and enqueue network enforcement
      parameters:
        - in: path
          name: service
          required: true
          schema: { type: string }
        - in: header
          name: X-Idempotency-Key
          required: true
          schema: { type: string, maxLength: 120 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 64 }
                note: { type: string, maxLength: 5000 }
      responses:
        '202': { description: Commercial state changed and network command queued }
        '403': { description: Missing suspension capability }
  /services/{service}/resume:
    post:
      summary: Resume a suspended service and enqueue network enforcement
      parameters:
        - in: path
          name: service
          required: true
          schema: { type: string }
        - in: header
          name: X-Idempotency-Key
          required: true
          schema: { type: string, maxLength: 120 }
      responses:
        '202': { description: Commercial state changed and network command queued }
        '403': { description: Missing activation or force-resume capability }
  /payments:
    post:
      summary: Record a customer payment
      parameters:
        - in: header
          name: X-Idempotency-Key
          required: true
          schema: { type: string, maxLength: 120 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '201': { description: Payment recorded }
        '400': { description: Missing or invalid idempotency key }
        '409': { description: Idempotency key reused for a different request }
        '422': { description: Validation failed }
  /portal/{tenant}/otp/request:
    post:
      security: []
      summary: Request a customer portal OTP
      description: Always returns the same response shape for known and unknown phone numbers.
      parameters:
        - in: path
          name: tenant
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string }
      responses:
        '200': { description: OTP challenge created }
        '429': { description: Rate limited }
  /portal/{tenant}/otp/verify:
    post:
      security: []
      summary: Verify a customer portal OTP
      parameters:
        - in: path
          name: tenant
          required: true
          schema: { type: string }
      responses:
        '200': { description: Portal bearer session issued }
        '422': { description: Invalid or expired code }
  /portal/{tenant}/me:
    get:
      summary: Read the authenticated customer portal profile
      parameters:
        - in: path
          name: tenant
          required: true
          schema: { type: string }
      responses:
        '200': { description: Customer profile and services }
        '401': { description: Invalid portal session }
  /portal/{tenant}/me/profile:
    patch:
      summary: Update customer contact and notification preferences
      parameters:
        - in: path
          name: tenant
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email, nullable: true }
                address: { type: string, maxLength: 500, nullable: true }
                notification_preferences: { type: object, additionalProperties: true }
      responses:
        '200': { description: Updated customer profile fields }
        '401': { description: Invalid portal session }
        '422': { description: Validation failed }
  /portal/{tenant}/me/services:
    get:
      summary: List the authenticated customer's services and current sessions
      parameters:
        - in: path
          name: tenant
          required: true
          schema: { type: string }
      responses:
        '200': { description: Customer service summaries }
        '401': { description: Invalid portal session }
  /portal/{tenant}/me/services/{service}/usage:
    get:
      summary: Read daily usage for an owned service
      parameters:
        - in: path
          name: tenant
          required: true
          schema: { type: string }
        - in: path
          name: service
          required: true
          schema: { type: string, description: Service public ULID }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        '200': { description: Daily input, output and total octets }
        '401': { description: Invalid portal session }
        '404': { description: Service is not owned by the portal customer }
  /portal/{tenant}/me/notices:
    get:
      summary: Read active incidents affecting the customer's zone or POP
      parameters:
        - in: path
          name: tenant
          required: true
          schema: { type: string }
      responses:
        '200': { description: Active customer-scoped outage notices }
        '401': { description: Invalid portal session }
  /portal/{tenant}/me/tickets:
    get:
      summary: List the authenticated customer's support tickets
      parameters:
        - in: path
          name: tenant
          required: true
          schema: { type: string }
      responses:
        '200': { description: Customer-owned ticket summaries }
        '401': { description: Invalid portal session }
    post:
      summary: Open a support ticket for the authenticated customer
      parameters:
        - in: path
          name: tenant
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, subject, description]
              properties:
                category: { type: string, enum: [no_service, slow, billing, relocation, other] }
                subject: { type: string, maxLength: 160 }
                description: { type: string, maxLength: 5000 }
                service_uuid: { type: string, nullable: true }
      responses:
        '201': { description: Ticket created }
        '401': { description: Invalid portal session }
        '422': { description: Validation failed }
  /portal/{tenant}/me/tickets/{ticket}:
    get:
      summary: Read a customer-owned ticket and public messages
      parameters:
        - in: path
          name: tenant
          required: true
          schema: { type: string }
        - in: path
          name: ticket
          required: true
          schema: { type: string, description: Ticket public ULID }
      responses:
        '200': { description: Ticket detail and public message history }
        '401': { description: Invalid portal session }
        '404': { description: Ticket not found }
  /portal/{tenant}/me/tickets/{ticket}/messages:
    post:
      summary: Add a public reply to a customer-owned ticket
      parameters:
        - in: path
          name: tenant
          required: true
          schema: { type: string }
        - in: path
          name: ticket
          required: true
          schema: { type: string, description: Ticket public ULID }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, maxLength: 5000 }
      responses:
        '200': { description: Ticket with the appended public message }
        '401': { description: Invalid portal session }
        '404': { description: Ticket not found }
  /portal/{tenant}/billing:
    get:
      summary: Read the authenticated customer's invoice and payment history
      parameters:
        - in: path
          name: tenant
          required: true
          schema: { type: string }
      responses:
        '200': { description: Recent invoices, lines and payments }
        '401': { description: Invalid portal session }
  /portal/{tenant}/payments/intent:
    post:
      summary: Create a customer payment intent through the configured gateway
      parameters:
        - in: path
          name: tenant
          required: true
          schema: { type: string }
        - in: header
          name: X-Idempotency-Key
          required: true
          schema: { type: string, maxLength: 120 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invoice_id, amount]
              properties:
                invoice_id: { type: string, description: Invoice public ULID }
                amount: { type: integer, minimum: 1, description: Amount in minor currency units }
      responses:
        '200': { description: Gateway-specific payment intent payload }
        '401': { description: Invalid portal session }
        '404': { description: Invoice not found for this customer }
        '503': { description: No payment gateway is configured }
  /collector/payments/batch:
    post:
      summary: Record collector payments in a partial-success batch
      parameters:
        - in: header
          name: X-Idempotency-Key
          required: true
          schema: { type: string, maxLength: 120 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  maxItems: 100
                  items: { $ref: '#/components/schemas/PaymentRequest' }
      responses:
        '200': { description: Per-item success/error results }
        '409': { description: Idempotency key reused for a different request }
  /collector/sync/bootstrap:
    get:
      summary: Bootstrap the collector's offline cache
      parameters:
        - in: query
          name: zone
          schema: { type: string, maxLength: 100 }
          description: Optional zone code used to narrow customer and service rows.
      responses:
        '200': { description: Full customer, service, plan and message snapshot with a signed sync token }
        '403': { description: Missing collector ability }
  /collector/sync/delta:
    get:
      summary: Read collector changes since a signed sync token
      parameters:
        - in: query
          name: since
          required: true
          schema: { type: string }
        - in: query
          name: zone
          schema: { type: string, maxLength: 100 }
      responses:
        '200': { description: Changed rows, tombstones and a replacement sync token }
        '403': { description: Missing collector ability }
        '422': { description: Invalid or foreign sync token }
  /collector/sync/push:
    post:
      summary: Push queued offline collector payments with partial success
      parameters:
        - in: header
          name: X-Idempotency-Key
          required: true
          schema: { type: string, maxLength: 120 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 100
              items: { $ref: '#/components/schemas/CollectorSyncPayment' }
      responses:
        '200': { description: Per-item created, replayed or rejected results }
        '422': { description: Invalid batch envelope }
        '409': { description: Idempotency key reused for a different request }
  /imports/customers:
    post:
      summary: Preview or import customers from CSV
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ImportRequest' } }
          multipart/form-data: { schema: { $ref: '#/components/schemas/ImportRequest' } }
      responses:
        '200': { description: Dry-run validation report }
        '201': { description: Completed import report }
        '403': { description: Missing customer capability }
  /imports/plans:
    post:
      summary: Preview or import plans from CSV
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ImportRequest' } }
          multipart/form-data: { schema: { $ref: '#/components/schemas/ImportRequest' } }
      responses:
        '200': { description: Dry-run validation report }
        '201': { description: Completed import report }
        '403': { description: Missing plan capability }
  /imports/services:
    post:
      summary: Preview or import services from CSV
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ImportRequest' } }
          multipart/form-data: { schema: { $ref: '#/components/schemas/ImportRequest' } }
      responses:
        '200': { description: Dry-run validation report }
        '201': { description: Completed import report }
        '403': { description: Missing service capability }
  /imports/equipment:
    post:
      summary: Preview or import serialized equipment from CSV
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ImportRequest' } }
          multipart/form-data: { schema: { $ref: '#/components/schemas/ImportRequest' } }
      responses:
        '200': { description: Dry-run validation report }
        '201': { description: Completed import report }
        '403': { description: Missing inventory capability }
  /imports/balances:
    post:
      summary: Preview or import signed opening balances from CSV
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ImportRequest' } }
          multipart/form-data: { schema: { $ref: '#/components/schemas/ImportRequest' } }
      responses:
        '200': { description: Dry-run validation report }
        '201': { description: Completed journal-backed import report }
        '403': { description: Missing billing adjustment capability }
  /imports/{import}/rollback:
    post:
      summary: Roll back an imported customer batch
      parameters:
        - in: path
          name: import
          required: true
          schema: { type: string }
      responses:
        '200': { description: Rollback result }
        '403': { description: Missing customer capability }
        '409': { description: Import cannot be rolled back safely }
  /imports/plans/{import}/rollback:
    post:
      summary: Roll back an imported plan batch
      parameters:
        - in: path
          name: import
          required: true
          schema: { type: string }
      responses:
        '200': { description: Rollback result }
        '403': { description: Missing plan capability }
        '409': { description: Import cannot be rolled back safely }
  /imports/services/{import}/rollback:
    post:
      summary: Roll back an imported service batch
      parameters:
        - in: path
          name: import
          required: true
          schema: { type: string }
      responses:
        '200': { description: Rollback result }
        '403': { description: Missing service capability }
        '409': { description: Import cannot be rolled back safely }
  /imports/equipment/{import}/rollback:
    post:
      summary: Roll back an imported equipment batch
      parameters:
        - in: path
          name: import
          required: true
          schema: { type: string }
      responses:
        '200': { description: Rollback result }
        '403': { description: Missing inventory capability }
        '409': { description: Import cannot be rolled back safely }
  /imports/balances/{import}/rollback:
    post:
      summary: Roll back an imported balance batch
      parameters:
        - in: path
          name: import
          required: true
          schema: { type: string }
      responses:
        '200': { description: Reversing journal entries created for the batch }
        '403': { description: Missing billing adjustment capability }
        '409': { description: Import cannot be rolled back safely }
  /imports/routers/{router}/subscribers:
    post:
      summary: Discover RouterOS PPP subscribers for an import report
      parameters:
        - in: path
          name: router
          required: true
          schema: { type: string, description: Router public ULID }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                dry_run: { type: boolean, default: false }
      responses:
        '200': { description: Dry-run discovery report }
        '201': { description: Completed subscriber discovery import }
        '403': { description: Missing network view capability }
  /partners/{partner}/catalog:
    get:
      summary: Read the effective plan catalog for a visible partner
      parameters:
        - in: path
          name: partner
          required: true
          schema: { type: string, description: Partner public ULID }
      responses:
        '200': { description: Partner-scoped sell prices and permitted commercial fields }
        '403': { description: Missing service view capability }
        '404': { description: Partner not found }
  /partners/{partner}/settlements:
    get:
      summary: List settlements for a visible partner
      parameters:
        - in: path
          name: partner
          required: true
          schema: { type: string, description: Partner public ULID }
      responses:
        '200': { description: Partner settlement statements }
        '403': { description: Missing wallet view capability }
        '404': { description: Partner not found }
    post:
      summary: Generate a partner settlement statement
      parameters:
        - in: path
          name: partner
          required: true
          schema: { type: string, description: Partner public ULID }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [period_start, period_end, currency]
              properties:
                period_start: { type: string, format: date }
                period_end: { type: string, format: date }
                currency: { type: string, minLength: 3, maxLength: 3 }
      responses:
        '201': { description: Generated settlement statement }
        '403': { description: Missing settlement approval capability }
        '404': { description: Partner not found }
  /settlements/{settlement}/approve:
    post:
      summary: Approve a generated partner settlement
      parameters:
        - in: path
          name: settlement
          required: true
          schema: { type: string, description: Settlement public ULID }
      responses:
        '200': { description: Approved settlement statement }
        '403': { description: Missing settlement approval capability }
        '404': { description: Settlement not found or not visible }
  /settlements/{settlement}/pay:
    post:
      summary: Pay an approved partner settlement
      parameters:
        - in: path
          name: settlement
          required: true
          schema: { type: string, description: Settlement public ULID }
        - in: header
          name: X-Idempotency-Key
          required: true
          schema: { type: string, maxLength: 120 }
      responses:
        '200': { description: Paid settlement statement }
        '403': { description: Missing settlement approval capability }
        '404': { description: Settlement not found or not visible }
        '409': { description: Idempotency key reused for a different request }
  /partners:
    get:
      summary: List partners visible to the authenticated operator
      responses:
        '200': { description: Descendant-scoped partner wallets }
        '403': { description: Missing wallet view capability }
  /partners/{partner}:
    get:
      summary: Read a visible partner and wallet statement
      parameters:
        - in: path
          name: partner
          required: true
          schema: { type: string, description: Partner public ULID }
      responses:
        '200': { description: Partner wallet and transactions }
        '403': { description: Missing wallet view capability }
        '404': { description: Partner not found }
  /partners/{partner}/wallet-top-ups:
    post:
      summary: Fund a partner wallet
      parameters:
        - in: path
          name: partner
          required: true
          schema: { type: string, description: Partner public ULID }
        - in: header
          name: X-Idempotency-Key
          required: true
          schema: { type: string, maxLength: 120 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: integer, minimum: 1 }
      responses:
        '201': { description: Wallet transaction created }
        '403': { description: Missing wallet funding capability }
        '409': { description: Idempotency key reused for a different request }
  /network/commands/{command}/retry:
    post:
      summary: Retry a failed network command
      parameters:
        - in: path
          name: command
          required: true
          schema: { type: string, description: Network command public ULID }
        - in: header
          name: X-Idempotency-Key
          required: true
          schema: { type: string, maxLength: 120 }
      responses:
        '202': { description: Replacement network command queued }
        '403': { description: Missing network provision capability }
  /technician/uploads:
    post:
      summary: Upload a technician work-order image separately from completion
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: JPEG, PNG or WebP image up to 20 MB }
      responses:
        '201': { description: Public media ID and non-sensitive file metadata }
        '403': { description: Missing work-order capability }
        '422': { description: Invalid media type or size }
  /technician/work-orders:
    get:
      summary: List work orders assigned to the authenticated technician
      parameters:
        - in: query
          name: date
          schema: { type: string, format: date }
        - in: query
          name: status
          schema: { type: string, enum: [scheduled, assigned, en_route, in_progress, completed, cancelled, failed] }
      responses:
        '200': { description: Assigned work-order summaries }
        '403': { description: Missing work-order capability }
  /technician/work-orders/{workOrder}:
    get:
      summary: Read an assigned work-order detail
      parameters:
        - in: path
          name: workOrder
          required: true
          schema: { type: string }
      responses:
        '200': { description: Work-order detail with checklist and event history }
        '403': { description: Missing work-order capability }
        '404': { description: Work order not found }
  /technician/work-orders/{workOrder}/complete:
    post:
      summary: Complete an assigned work order idempotently
      parameters:
        - in: path
          name: workOrder
          required: true
          schema: { type: string }
        - in: header
          name: X-Idempotency-Key
          required: true
          schema: { type: string, maxLength: 120 }
      responses:
        '200': { description: Work order completion and resulting service state }
        '403': { description: Missing work-order capability }
        '409': { description: Completion key conflicts with another work order }
  /technician/inventory:
    get:
      summary: List equipment in the authenticated technician's van warehouse
      responses:
        '200': { description: Warehouse and serialized unit list }
        '403': { description: Missing technician ability }
  /technician/services/{service}/diagnostics:
    get:
      summary: Read tenant-scoped service diagnostics
      parameters:
        - in: path
          name: service
          required: true
          schema: { type: string }
      responses:
        '200': { description: Service state, live session, usage and recent command outcomes }
        '403': { description: Missing technician ability }
        '404': { description: Service not found }
  /webhooks/gateways/{gateway}:
    post:
      security: []
      summary: Receive a signed payment or message gateway webhook
      parameters:
        - in: path
          name: gateway
          required: true
          schema: { type: string }
        - in: header
          name: X-Webhook-Signature
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Webhook accepted and processed idempotently }
        '401': { description: Invalid webhook signature }
        '422': { description: Invalid webhook body }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
  schemas:
    PaymentRequest:
      type: object
      required: [customer_id, amount, currency, method]
      properties:
        customer_id: { type: string, description: Customer public ULID }
        invoice_id: { type: string, nullable: true, description: Invoice public ULID }
        amount: { type: integer, minimum: 1, description: Amount in minor currency units }
        currency: { type: string, minLength: 3, maxLength: 3 }
        method: { type: string, maxLength: 40 }
        idempotency_key: { type: string, description: Required for collector batch items }
    CollectorSyncPayment:
      type: object
      required: [customer_uuid, amount, currency, method, idempotency_key]
      properties:
        customer_uuid: { type: string, description: Customer public ULID accepted by offline clients }
        invoice_id: { type: string, nullable: true, description: Invoice public ULID }
        amount: { type: integer, minimum: 1, description: Amount in minor currency units }
        currency: { type: string, minLength: 3, maxLength: 3 }
        method: { type: string, maxLength: 40 }
        idempotency_key: { type: string, maxLength: 120 }
    ImportRequest:
      type: object
      properties:
        filename: { type: string, maxLength: 255 }
        csv: { type: string, description: CSV text for JSON clients }
        file: { type: string, format: binary, description: CSV upload for multipart clients }
        dry_run: { type: boolean, default: false }
      description: Provide either csv text or a file upload.
    ImportResponse:
      type: object
      required: [id, type, status, total_rows, successful_rows, failed_rows, report]
      properties:
        id: { type: string }
        type: { type: string }
        filename: { type: string }
        status: { type: string, enum: [preview, completed, rolled_back] }
        total_rows: { type: integer }
        successful_rows: { type: integer }
        failed_rows: { type: integer }
        report: { type: array, items: { type: object } }
