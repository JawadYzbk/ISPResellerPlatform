        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: type
          schema: { type: string, enum: [top_up, renewal] }
        - in: query
          name: direction
          schema: { type: string, enum: [credit, debit] }
      responses:
        '200': { description: Cursor-paginated partner wallet transactions }
        '403': { description: Missing wallet view capability }
        '404': { description: Partner not found }
