  /collector/customers:
    get:
      summary: List collector customers by search, zone, due state, or overdue state
      parameters:
        - in: query
          name: q
          schema: { type: string, maxLength: 120 }
        - in: query
          name: zone
          schema: { type: string, maxLength: 100 }
        - in: query
          name: status
          schema: { type: string, example: due,overdue }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200': { description: Cursor-paginated collector-safe customer summaries }
        '403': { description: Missing collector ability }
  /collector/customers/{customer}:
    get:
      summary: Read one collector customer with service, balance, location, and last payment
      parameters:
        - in: path
          name: customer
          required: true
          schema: { type: string, description: Customer public ULID }
      responses:
        '200': { description: Collector-safe customer detail }
        '403': { description: Missing customer view capability }
        '404': { description: Customer not found }
  /collector/shift/open:
    post:
      summary: Open the authenticated collector's cash shift
      parameters:
        - in: header
          name: X-Idempotency-Key
          required: true
          schema: { type: string, maxLength: 120 }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                opening_float:
                  type: object
                  additionalProperties: { type: integer, minimum: 0 }
                  description: Opening cash by ISO currency in minor units
      responses:
        '201': { description: Shift opened }
        '409': { description: Idempotency key reused for a different request }
        '422': { description: Collector already has an open shift or the opening float is invalid }
  /collector/shift/close:
    post:
      summary: Close and reconcile the authenticated collector's cash shift
      parameters:
        - in: header
          name: X-Idempotency-Key
          required: true
          schema: { type: string, maxLength: 120 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [declared_totals]
              properties:
                declared_totals:
                  type: object
                  additionalProperties: { type: integer, minimum: 0 }
                variance_note: { type: string, maxLength: 2000, nullable: true }
      responses:
        '200': { description: Closed shift with normalized system and declared totals }
        '409': { description: No open shift or idempotency key conflict }
        '422': { description: Variance note missing or totals invalid }
  /collector/payments:
    get:
      summary: List the authenticated collector's posted payments
      parameters:
        - in: query
          name: date
          schema: { type: string, format: date }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200': { description: Cursor-paginated collector receipts and allocations }
        '403': { description: Missing collector ability }
    post:
      summary: Record collector payments in a partial-success batch
      parameters:
        - in: header
          name: X-Idempotency-Key
          required: true
          schema: { type: string, maxLength: 120 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  maxItems: 100
                  items: { $ref: '#/components/schemas/PaymentRequest' }
      responses:
        '200': { description: Per-item success/error results }
        '409': { description: Idempotency key reused for a different request }
  /collector/summary:
    get:
      summary: Read the authenticated collector's daily payment totals
      parameters:
        - in: query
          name: date
          schema: { type: string, format: date }
      responses:
        '200': { description: Payment count and totals by currency }
        '403': { description: Missing collector ability }
  /collector/payments/{payment}/receipt:
    post:
      summary: Queue a payment receipt for resend through one channel
      parameters:
        - in: path
          name: payment
          required: true
          schema: { type: string, description: Payment public ULID }
        - in: header
          name: X-Idempotency-Key
          required: true
          schema: { type: string, maxLength: 120 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel]
              properties:
                channel: { type: string, enum: [whatsapp, sms, email] }
      responses:
        '202': { description: Receipt queued or not queued because the channel is unavailable }
        '403': { description: Payment is not owned by the collector }
        '422': { description: Receipt cannot be resent }
  /collector/sync/bootstrap:
    get:
      summary: Bootstrap the collector's offline cache
      parameters:
        - in: query
          name: zone
          schema: { type: string, maxLength: 100 }
          description: Optional zone code used to narrow customer and service rows.
      responses:
        '200': { description: Full customer, service, plan and message snapshot with a signed sync token }
        '403': { description: Missing collector ability }
  /collector/sync/delta:
    get:
      summary: Read collector changes since a signed sync token
      parameters:
